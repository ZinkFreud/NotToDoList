# NotToDo - imzali AAB uretir.
# Elle calistirilir: Actions sekmesi -> "AAB derle" -> Run workflow.
 
name: AAB derle
 
on:
  workflow_dispatch:
 
jobs:
  derle:
    runs-on: ubuntu-latest
 
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
 
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
 
      - name: Android SDK
        uses: android-actions/setup-android@v3
 
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
 
      - name: Anahtari dosyaya yaz
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "HATA: KEYSTORE_BASE64 gizli degiskeni bos."
            exit 1
          fi
          echo "base64 metninin uzunlugu: ${#KEYSTORE_BASE64} karakter"
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/imza.jks"
          echo "cozulen dosyanin boyutu:"
          ls -l "$RUNNER_TEMP/imza.jks"
 
      # Bu adim bilerek isi DURDURMUYOR: amaci teshis.
      # Parmak izi gizli bilgi degil, Play Console da ayni degeri gosteriyor.
      - name: Anahtari incele
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set +e
          echo "===== DOSYA ====="
          ls -l "$RUNNER_TEMP/imza.jks"
          file "$RUNNER_TEMP/imza.jks"
          echo "===== KEYTOOL NEREDE ====="
          echo "JAVA_HOME=$JAVA_HOME"
          which keytool || echo "PATH'te keytool yok"
          ls -l "$JAVA_HOME/bin/keytool" || echo "JAVA_HOME icinde de yok"
          echo "===== SIFRE VERILDI MI ====="
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "KEYSTORE_PASSWORD BOS GELDI"
          else
            echo "KEYSTORE_PASSWORD dolu (${#KEYSTORE_PASSWORD} karakter)"
          fi
          echo "===== KEYTOOL CIKTISI ====="
          "$JAVA_HOME/bin/keytool" -list -v \
              -keystore "$RUNNER_TEMP/imza.jks" \
              -storepass "$KEYSTORE_PASSWORD" 2>&1 | head -60
          echo "===== keytool cikis kodu: ${PIPESTATUS[0]} ====="
 
      - name: Derle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/imza.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # gradlew Windows'tan geldigi icin calistirma izni yok; veriyoruz.
          chmod +x ./gradlew
          # .aab Play icin, .apk telefona kurup denemek icin.
          ./gradlew bundleRelease assembleRelease --no-daemon --no-configuration-cache --stacktrace
 
      - name: Ureteni goster
        if: always()
        run: find app/build/outputs \( -name "*.aab" -o -name "*.apk" \) -exec ls -lh {} \; || true
 
      - name: AAB dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: nottodo-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
 
      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: nottodo-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
