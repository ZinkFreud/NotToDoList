# NotToDo - imzali AAB uretir.
# Elle calistirilir: Actions sekmesi -> "AAB derle" -> Run workflow.
# Imza anahtari ve sifreler depo gizli degiskenlerinden (Secrets) gelir.
 
name: AAB derle
 
on:
  workflow_dispatch:
 
jobs:
  derle:
    runs-on: ubuntu-latest
 
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
 
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
 
      - name: Android SDK
        uses: android-actions/setup-android@v3
 
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
 
      - name: Anahtari dosyaya yaz
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 gizli degiskeni bos. Depo ayarlarindan ekle."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/imza.jks"
          ls -l "$RUNNER_TEMP/imza.jks"
 
      - name: Anahtarin parmak izi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Parmak izi gizli bilgi degil; Play Console da ayni degeri gosteriyor.
          # Buradaki SHA1 ile Play'deki "yukleme anahtari sertifikasi" ayni olmali.
          keytool -list -v -keystore "$RUNNER_TEMP/imza.jks" \
                  -storepass "$KEYSTORE_PASSWORD" \
            | grep -E "Alias name|SHA1:|SHA256:"
 
      - name: Derle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/imza.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --no-configuration-cache --stacktrace
 
      - name: Ureteni goster
        run: |
          find app/build/outputs -name "*.aab" -exec ls -lh {} \;
 
      - name: AAB dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: nottodo-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
